[project]
name = "onboarding-agent"
version = "0.1.0"
description = "Conversational career-data entry (#117): a LangGraph interview that writes through the Go API's own REST endpoints"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "langgraph>=1.0.4",
    "langgraph-checkpoint-sqlite>=3.0.1",
    "langchain-anthropic>=1.1.1",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14",
    # See docx-renderer/pyproject.toml for why httpx2 rather than plain httpx:
    # FastAPI's TestClient needs it and Starlette deprecates plain httpx there.
    "httpx2>=0.29",
]

[tool.basedpyright]
reportUnusedCallResult = false

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.pytest.ini_options]
# main.py lives at the project root, not in a package, so the root has to be
# importable from tests/ — same reason docx-renderer sets this.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
