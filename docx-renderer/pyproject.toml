[project]
name = "docx-renderer"
version = "0.1.0"
description = "Renders the intermediate resume JSON document to .docx"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.0",
    "python-docx>=1.2.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14",
    # FastAPI's TestClient is a thin wrapper over httpx2; it is the supported
    # way to exercise the /render endpoint without binding a port. Starlette
    # deprecates plain httpx here, so pin httpx2 rather than inherit a warning.
    "httpx2>=0.29",
]

[tool.basedpyright]
reportUnusedCallResult = false

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.pytest.ini_options]
# main.py and models.py live at the project root, not in a package, so the
# root has to be importable from tests/.
pythonpath = ["."]
testpaths = ["tests"]
