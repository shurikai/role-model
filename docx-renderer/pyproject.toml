[project]
name = "docx-renderer"
version = "0.1.0"
description = "Renders the intermediate resume JSON document to .docx"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.0",
    "python-docx>=1.2.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14",
]

[tool.basedpyright]
reportUnusedCallResult = false

[tool.ruff]
line-length = 88
target-version = "py314"
