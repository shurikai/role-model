# Serves the built bundle and proxies the API from the same origin.
#
# The proxy is the point. VITE_API_BASE_URL is consumed at BUILD time, so a
# bundle built with an absolute URL only works for whoever it was built for —
# "http://localhost:8080/api/v1" breaks the moment someone reaches the
# instance by LAN address or hostname, which is exactly what a self-hoster
# does. Serving the API under the same origin lets the bundle use a relative
# "/api/v1" and be correct from every address at once.
#
# It also means the bundled deployment needs no CORS configuration at all:
# the browser sees one origin, so there is no cross-origin request to allow.
# CORS_ALLOWED_ORIGINS still matters for `make dev`, where Vite is on :5173
# and the API on :8080.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-lived caching for fingerprinted assets, none for the entry point.
    # index.html names the current bundle, so caching it is how a browser
    # keeps loading yesterday's app after a redeploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generation legitimately takes minutes — career extraction is capped
        # at 16384 output tokens, and 2a/2b are two model calls in series.
        # nginx's 60s default would cut those off at the proxy and return a
        # 504 while the server was still working, which reads as a backend
        # failure rather than as a timeout here. Kept above the server's own
        # deadlines so the server is what reports a stall.
        proxy_connect_timeout 10s;
        proxy_send_timeout    6m;
        proxy_read_timeout    6m;

        # The API caps bodies itself (handlers.MaxRequestBody); this matches
        # so an oversized request is refused with the API's structured 413
        # rather than nginx's HTML error page.
        client_max_body_size 2m;
    }

    location /health {
        proxy_pass http://server:8080/health;
        access_log off;
    }

    # Client-side routing: /applications/<id> is a React Router path, not a
    # file. Without this it 404s on reload, which is the classic SPA-behind-a-
    # webserver bug.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
