version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          # Nullable uuids as *uuid.UUID, matching emit_pointers_for_null_types
          # for every other type. Without this sqlc falls back to pgtype.UUID,
          # which marshals as {"Bytes":[...],"Valid":true} — so the moment a
          # uuid column becomes nullable, every API response carrying it
          # silently changes shape.
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - column: "applications.jd_signals"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
              pointer: true
          - column: "resume_versions.generation_params"
            go_type: {import: "encoding/json", type: "RawMessage", pointer: true}
          - column: "resume_versions.structured_output"
            go_type: {import: "encoding/json", type: "RawMessage", pointer: true}
          - column: "contribution_feedback.edited_deltas"
            go_type: {import: "encoding/json", type: "RawMessage", pointer: true}
          - column: "contribution_drafts.flags"
            go_type: {import: "encoding/json", type: "RawMessage", pointer: true}
          - column: "fit_reports.anti_pattern_hits"
            go_type: {import: "encoding/json", type: "RawMessage", pointer: true}
          - column: "fit_reports.technical_gaps"
            go_type: {import: "encoding/json", type: "RawMessage", pointer: true}
          - column: "fit_reports.technical_matches"
            go_type: {import: "encoding/json", type: "RawMessage", pointer: true}
          - column: "fit_reports.preference_gaps"
            go_type: {import: "encoding/json", type: "RawMessage", pointer: true}
          - column: "fit_reports.preference_conflicts"
            go_type: {import: "encoding/json", type: "RawMessage", pointer: true}
          - column: "fit_reports.screening_summary"
            go_type: {import: "encoding/json", type: "RawMessage", pointer: true}
